<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password · My Records Collection</title>
    <script src="js/theme-bootstrap.js?v=20260906200000"></script>
    <link rel="stylesheet" href="css/style.css?v=20260827180000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="logo-icon" aria-hidden="true">&#127926;</span>
                <h1>Reset your password</h1>
            </div>
            <div class="auth-alert hidden" id="resetAlert" role="alert" aria-live="assertive"></div>
            <form class="auth-form" id="resetForm" novalidate>
                <div class="form-group">
                    <label for="reset-password">New password</label>
                    <input type="password" id="reset-password" class="input" autocomplete="new-password" minlength="8" required
                        aria-describedby="reset-hint">
                    <small id="reset-hint" class="form-hint">At least 8 characters, including a letter and a number.</small>
                </div>
                <div class="form-group">
                    <label for="reset-confirm">Confirm new password</label>
                    <input type="password" id="reset-confirm" class="input" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">Set new password</button>
            </form>
            <p class="auth-foot"><a href="login.html">Back to sign in</a></p>
        </div>
    </main>
    <script src="js/reset.js?v=20260906200000"></script>
</body>
</html>
